<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chawk — line art → equations</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark" aria-hidden="true">◍</span> Chawk</div>
  <div id="presets" class="presets" role="group" aria-label="Preset">
    <button type="button" data-preset="balanced" aria-pressed="true">Balanced</button>
    <button type="button" data-preset="precise" aria-pressed="false">Precise</button>
    <button type="button" data-preset="simple" aria-pressed="false">Simple</button>
    <button type="button" data-preset="complex" aria-pressed="false">Dense</button>
  </div>
  <div class="top-actions">
    <button id="tune" type="button" aria-expanded="false">Tune<span id="tune-dot" class="tunedot" hidden></span></button>
    <span id="health" class="health unknown" title="backend status">…</span>
  </div>
</header>

<div id="tune-pop" class="tune-pop" hidden>
  <label class="row"><span>Detail <b id="rmse-val"></b></span>
    <input id="rmse" type="range" min="0.5" max="6" step="0.1" value="2"></label>
  <label class="row"><span>Max wiggle <b id="maxerr-val"></b></span>
    <input id="maxerr" type="range" min="2" max="15" step="0.5" value="6"></label>
  <label class="row"><span>Max degree <b id="poly-val"></b></span>
    <input id="poly" type="range" min="1" max="6" step="1" value="4"></label>
  <fieldset>
    <legend>Curve types</legend>
    <label><input id="m-circle" type="checkbox" checked> circles</label>
    <label><input id="m-ellipse" type="checkbox" checked> ellipses</label>
    <label><input id="m-sinusoid" type="checkbox" checked> waves</label>
    <label><input id="m-spline" type="checkbox" checked> freeform</label>
  </fieldset>
  <label class="check"><input id="labels" type="checkbox" checked> labels on image</label>
  <label class="check"><input id="debug" type="checkbox"> debug view</label>
  <button id="reset" type="button" class="link">Reset to Balanced</button>
</div>

<main id="stage">
  <div id="dropzone" class="sheet" tabindex="0" role="button" aria-label="Canvas. Activate to choose an image, or drop a file or paste anywhere.">
    <input id="file" type="file" accept="image/png,image/jpeg,image/bmp,image/webp,image/tiff" hidden>
    <div id="empty">
      <p class="prompt"><strong>Drop a drawing</strong> anywhere · click · Ctrl+V</p>
      <div class="samples">
        <button type="button" data-sample="sine_wave.png"><img src="samples/sine_wave.png" alt="sine wave sample"><span>sine</span></button>
        <button type="button" data-sample="geometric.png"><img src="samples/geometric.png" alt="geometry sample"><span>shapes</span></button>
        <button type="button" data-sample="parabola_line.png"><img src="samples/parabola_line.png" alt="curve sample"><span>curve</span></button>
      </div>
      <p class="note">dark lines on white · PNG/JPG ≤15MB</p>
    </div>
    <img id="paper" alt="drawing" hidden>
    <div id="scan" class="scan" hidden></div>
  </div>

  <aside id="eqsheet" class="eqsheet" hidden aria-label="Equations">
    <div class="eqhead">
      <div><strong id="stat-strokes">0</strong> strokes · <strong id="stat-eqs">0</strong> equations</div>
      <div id="stat-fit" class="fit"></div>
      <button id="eqclose" type="button" aria-label="Close equations">×</button>
    </div>
    <div id="equations"></div>
  </aside>
</main>

<div id="dock" class="dock">
  <button id="go" type="button" disabled>Trace</button>
  <button id="cancel" type="button" hidden>✕</button>
  <div id="viewbar" class="seg" role="group" aria-label="Image view" hidden>
    <button type="button" data-view="fitted" aria-pressed="true">Fitted</button>
    <button type="button" data-view="original" aria-pressed="false">Original</button>
    <button type="button" data-view="debug" aria-pressed="false" hidden>Debug</button>
  </div>
  <div id="dock-result" class="dock-result" hidden>
    <a id="dl-png" download="chawk.png" title="Download annotated PNG">PNG</a>
    <a id="dl-json" download="chawk.json" title="Download JSON report">JSON</a>
    <button id="eqtoggle" type="button" aria-expanded="false">Equations</button>
    <button id="fresh" type="button" title="Start over with a new drawing">New</button>
  </div>
</div>

<p id="status" class="status" role="status" aria-live="polite"></p>
<div id="error" class="toast" role="alert" tabindex="-1" hidden>
  <p id="error-text"></p>
  <button id="error-action" type="button" hidden></button>
</div>

<script src="app.js"></script>
</body>
</html>
