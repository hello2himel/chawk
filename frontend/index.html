<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chawk — line art → equations</title>
<link rel="stylesheet" href="vendor/remixicon.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><i class="ri-shapes-line" aria-hidden="true"></i> Chawk</div>
  <div class="top-actions">
    <span id="health" class="health unknown" title="backend status">…</span>
  </div>
</header>

<div id="error" class="toast" role="alert" tabindex="-1" hidden>
  <i class="ri-alert-line" aria-hidden="true"></i>
  <p id="error-text"></p>
  <button id="error-action" type="button" hidden><i id="error-icon" class="ri-arrow-right-line" aria-hidden="true"></i><span id="error-label"></span></button>
</div>

<main id="stage">
  <div id="dropzone" class="sheet" tabindex="0" role="button" aria-label="Canvas. Activate to choose an image, or drop a file or paste anywhere.">
    <input id="file" type="file" accept="image/png,image/jpeg,image/bmp,image/webp,image/tiff" hidden>
    <div id="viewbar" class="seg views" role="group" aria-label="Image view" hidden>
      <button type="button" data-view="fitted" aria-pressed="true"><i class="ri-magic-line" aria-hidden="true"></i>Fitted</button>
      <button type="button" data-view="original" aria-pressed="false"><i class="ri-eye-line" aria-hidden="true"></i>Original</button>
      <button type="button" data-view="debug" aria-pressed="false" hidden><i class="ri-bug-line" aria-hidden="true"></i>Debug</button>
    </div>
    <div id="empty">
      <p class="prompt"><i class="ri-upload-cloud-2-line" aria-hidden="true"></i><strong>Drop a drawing</strong> anywhere · click · Ctrl+V</p>
      <div class="samples">
        <button type="button" data-sample="sine_wave.png"><img src="samples/sine_wave.png" alt="sine wave sample"><span>sine</span></button>
        <button type="button" data-sample="geometric.png"><img src="samples/geometric.png" alt="geometry sample"><span>shapes</span></button>
        <button type="button" data-sample="parabola_line.png"><img src="samples/parabola_line.png" alt="curve sample"><span>curve</span></button>
      </div>
      <p class="note">dark lines on white · PNG/JPG ≤15MB</p>
    </div>
    <img id="paper" alt="drawing" hidden>
    <div id="scan" class="scan" hidden></div>
  </div>

  <aside id="eqsheet" class="eqsheet" hidden aria-label="Equations">
    <div class="eqhead">
      <div><strong id="stat-strokes">0</strong> strokes · <strong id="stat-eqs">0</strong> equations</div>
      <a id="dl-png" download="chawk.png" title="Download annotated PNG"><i class="ri-image-line" aria-hidden="true"></i>PNG</a>
      <a id="dl-json" download="chawk.json" title="Download JSON report"><i class="ri-file-text-line" aria-hidden="true"></i>JSON</a>
      <button id="eqclose" type="button" aria-label="Close equations"><i class="ri-close-line" aria-hidden="true"></i></button>
    </div>
    <div id="stat-fit" class="fit"></div>
    <div id="equations"></div>
  </aside>
</main>

<div id="dock" class="dock">
  <button id="preset-btn" type="button" aria-expanded="false" aria-haspopup="listbox" title="Fit preset">
    <i class="ri-stack-line" aria-hidden="true"></i><span id="preset-label">Balanced</span><i class="ri-arrow-down-s-line caret" aria-hidden="true"></i>
  </button>
  <button id="tune" type="button" aria-expanded="false" title="Fine-tune fit">
    <i class="ri-equalizer-line" aria-hidden="true"></i>Tune<span id="tune-dot" class="tunedot" hidden></span>
  </button>
  <button id="go" type="button" disabled><i id="go-icon" class="ri-play-line" aria-hidden="true"></i><span id="go-text">Trace</span></button>
  <button id="eqtoggle" type="button" aria-expanded="false" hidden><i class="ri-function-line" aria-hidden="true"></i>Equations</button>
  <button id="fresh" type="button" title="Start over with a new drawing" hidden><i class="ri-add-line" aria-hidden="true"></i>New</button>
</div>
<div id="presets" class="menu" role="listbox" aria-label="Preset" hidden>
  <button type="button" data-preset="balanced" aria-pressed="true" role="option">Balanced<span>good for most drawings</span></button>
  <button type="button" data-preset="precise" aria-pressed="false" role="option">Precise<span>tighter fit, more equations</span></button>
  <button type="button" data-preset="simple" aria-pressed="false" role="option">Simple<span>fewer, simpler equations</span></button>
  <button type="button" data-preset="complex" aria-pressed="false" role="option">Dense art<span>many strokes, busy drawings</span></button>
</div>
<div id="tune-pop" class="menu panel" hidden>
  <label class="row"><span>Detail <b id="rmse-val"></b></span>
    <input id="rmse" type="range" min="0.5" max="6" step="0.1" value="2"></label>
  <label class="row"><span>Max wiggle <b id="maxerr-val"></b></span>
    <input id="maxerr" type="range" min="2" max="15" step="0.5" value="6"></label>
  <label class="row"><span>Max degree <b id="poly-val"></b></span>
    <input id="poly" type="range" min="1" max="6" step="1" value="4"></label>
  <fieldset>
    <legend>Curve types</legend>
    <div class="modelgrid">
      <label><input id="m-circle" type="checkbox" checked> circles</label>
      <label><input id="m-ellipse" type="checkbox" checked> ellipses</label>
      <label><input id="m-sinusoid" type="checkbox" checked> waves</label>
      <label><input id="m-spline" type="checkbox" checked> freeform</label>
    </div>
  </fieldset>
  <label class="check"><input id="labels" type="checkbox" checked> labels on image</label>
  <button id="reset" type="button" class="resetbtn"><i class="ri-restart-line" aria-hidden="true"></i>Reset to Balanced</button>
  <p id="server-ver" class="serverver"></p>
</div>
<p id="status" class="status" role="status" aria-live="polite"></p>

<script src="app.js"></script>
</body>
</html>
